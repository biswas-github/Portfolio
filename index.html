<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Mahmood Fazile</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1a1a1a 50%, #2a2a2a 50%);
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 90%;
        max-width: 1200px;
        margin: auto;
        padding: 20px;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 0;
      }

      .logo {
        font-size: 24px;
        font-weight: bold;
        color: #ff4d00;
      }

      .nav-links {
        display: flex;
        gap: 30px;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 16px;
      }

      .nav-links a:hover {
        color: #ff4d00;
      }

      .hire-me-nav {
        background-color: #ff4d00;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      .hire-me-nav:hover {
        background-color: #e04300;
      }

      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 50px 0;
      }

      .hero-content {
        max-width: 50%;
        height: 30rem;
      }

      .hero-content h1 {
        font-size: 48px;
        color: #ff4d00;
        margin: 20px 0;
      }

      .hero-content h1 span {
        color: white;
        font-size: 36px;
      }

      .social-icons {
        display: flex;
        gap: 15px;
        margin: 20px 0;
      }

      .social-icons a {
        color: white;
        font-size: 20px;
      }

      .social-icons a:hover {
        color: #ff4d00;
      }

      .buttons {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }

      .hire-me-btn,
      .download-cv-btn {
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }

      .hire-me-btn {
        background-color: #ff4d00;
        color: white;
        border: none;
      }

      .hire-me-btn:hover {
        background-color: #e04300;
      }

      .download-cv-btn {
        background-color: transparent;
        color: white;
        border: 2px solid white;
      }

      .download-cv-btn:hover {
        background-color: white;
        color: black;
      }

      .stats {
        display: flex;
        gap: 30px;
        margin-top: 40px;
      }

      .stat-box {
        background-color: #2a2a2a;
        padding: 20px;
        border-radius: 5px;
        text-align: center;
        flex: 1;
      }

      .stat-box h2 {
        font-size: 24px;
        color: #ff4d00;
      }

      .stat-box p {
        font-size: 16px;
        color: white;
      }

      .hero-image {
        max-width: 40%;
      }

      .hero-image img {
        width: 100%;
        border-radius: 50%;
      }

      @media (max-width: 768px) {
        .hero {
          flex-direction: column;
          text-align: center;
        }

        .hero-content {
          max-width: 100%;
        }

        .hero-image {
          max-width: 60%;
          margin-top: 30px;
        }

        .stats {
          flex-direction: column;
        }
      }
      .contact-section {
        background-color: #1c1c1c;
        color: #fff;
        padding: 60px 20px;
        text-align: center;
      }

      .contact-section h2 {
        color: #ff4500;
        font-size: 36px;
        margin-bottom: 10px;
      }

      .contact-section p {
        font-size: 18px;
        margin-bottom: 30px;
        color: #ccc;
      }

      .contact-form {
        max-width: 600px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .contact-form input,
      .contact-form textarea {
        padding: 12px;
        border: none;
        border-radius: 5px;
        background-color: #2e2e2e;
        color: #fff;
      }

      .contact-form input::placeholder,
      .contact-form textarea::placeholder {
        color: #aaa;
      }

      .submit-btn {
        background-color: #ff4500;
        color: #fff;
        border: none;
        padding: 14px;
        cursor: pointer;
        border-radius: 5px;
        font-size: 16px;
        transition: background-color 0.3s ease;
      }

      .submit-btn:hover {
        background-color: #e03e00;
      }

      .social-icons {
        margin-top: 30px;
      }

      .social-icons a {
        color: #ff4500;
        font-size: 24px;
        margin: 0 10px;
        transition: color 0.3s ease;
      }

      .social-icons a:hover {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav>
        <div class="logo">LOGO</div>
        <div class="nav-links">
          <a href="#">Home</a>
          <a href="#">Services</a>
          <a href="#">About me</a>
          <a href="#">Portfolio</a>
          <a href="#">Contact me</a>
        </div>
        <button class="hire-me-nav">Hire Me</button>
      </nav>

      <section class="hero">
        <div class="hero-content">
          <h1>
            <span>Hi I am</span><br />Biswas Banstola<br />Software Engineering
            student
          </h1>
          <div class="social-icons">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-linkedin-in"></i></a>
            <a href="#"><i class="fab fa-dribbble"></i></a>
            <a href="#"><i class="fab fa-behance"></i></a>
          </div>
          <div class="buttons">
            <button class="hire-me-btn">Hire Me</button>
            <button class="download-cv-btn">Download CV</button>
          </div>
          <div class="stats">
            <div class="stat-box">
              <h2>5+</h2>
              <p>Experience</p>
            </div>
            <div class="stat-box">
              <h2>20+</h2>
              <p>Project done</p>
            </div>
            <div class="stat-box">
              <h2>80+</h2>
              <p>Happy clients</p>
            </div>
          </div>
        </div>
        <div class="hero-image">
          <!-- Placeholder for image; replace with actual image source -->
          <img src="assets/uploads/biswas.jpg" alt="biswas Banstola" />
        </div>
      </section>
      <section id="contact" class="contact-section">
        <div class="contact-container">
          <h2>Contact Me</h2>
          <p>Let's work together or just say hi!</p>

          <form action="#" method="POST" class="contact-form">
            <input type="text" name="name" placeholder="Your Name" required />
            <input
              type="email"
              name="email"
              placeholder="Your Email"
              required
            />
            <textarea
              name="message"
              rows="5"
              placeholder="Your Message"
              required
            ></textarea>
            <button type="submit" class="btn submit-btn">Send Message</button>
          </form>

          <div class="social-icons">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-linkedin-in"></i></a>
            <a href="#"><i class="fab fa-behance"></i></a>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
